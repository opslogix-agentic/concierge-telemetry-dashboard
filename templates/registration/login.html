{% extends 'base.html' %}{% block content %}<div class="login card"><div class="eyebrow">CP NORTH OPERATIONS</div><h1>Welcome back.</h1><p class="muted">Sign in to view network inventory and monitoring status.</p>{% if form.errors %}<p class="banner">The username or password is incorrect.</p>{% endif %}<form method="post">{% csrf_token %}<label for="id_username">Username</label><input id="id_username" name="username" autocomplete="username" required autofocus><label for="id_password">Password</label><input id="id_password" name="password" type="password" autocomplete="current-password" required><input type="hidden" name="next" value="{{ next }}"><button class="primary">Sign in</button></form></div>{% endblock %}
