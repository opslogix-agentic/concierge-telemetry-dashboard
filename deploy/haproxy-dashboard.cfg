# Loaded alongside the original haproxy.cfg; existing conf.d is not activated.
frontend concierge_dashboard_local
    bind 127.0.0.1:8082
    mode http
    default_backend concierge_dashboard

backend concierge_dashboard
    mode http
    option httpchk
    http-check send meth GET uri /telemetry/healthz/ ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server dashboard 127.0.0.1:8081 check
